name: 💡 Feature Request / Proposal
description: Suggest an idea or architectural enhancement for TechRadar-Agent
title: "[Feature]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome community suggestions and ideas to make TechRadar-Agent more powerful and extensible!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe the solution or new capability you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?